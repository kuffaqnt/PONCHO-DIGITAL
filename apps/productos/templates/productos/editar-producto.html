{% extends "base.html" %}
{% load static %}

{% block title %}Editar producto - Poncho Digital{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <section class="tarjeta-formulario">
                <h2>Editar producto</h2>

                <form id="form-producto" action="{% url 'editar_producto' producto.id %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% for campo in form %}
                        <div class="mb-3">
                            <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">{{ campo.label }}</label>
                            {{ campo }}
                            {{ campo.errors }}
                        </div>
                    {% endfor %}

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn-poncho-principal">Guardar cambios</button>
                        <a href="{% url 'gestion_productos' %}" class="btn-poncho-secundario">Cancelar</a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'JS/comun.js' %}"></script>
    <script src="{% static 'JS/productos.js' %}"></script>
{% endblock %}
