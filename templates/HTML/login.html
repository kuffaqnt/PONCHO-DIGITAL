{% extends "HTML/base.html" %}
{% load static %}

{% block title %}Iniciar sesión - Poncho Digital{% endblock %}

{% block content %}
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">

                <form id="form-login" action="{% url 'login' %}" method="post">
                    {% csrf_token %}
                    <fieldset class="tarjeta-formulario">
                        <legend class="float-none w-auto px-2 fw-bold fs-5">Iniciar sesión</legend>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" id="correo" name="correo" class="form-control" placeholder="nombre@correo.com">
                        </div>

                        <div class="mb-3">
                            <label for="contrasenia" class="form-label">Contraseña</label>
                            <input type="password" id="contrasenia" name="contrasenia" class="form-control" placeholder="Mínimo 8 caracteres">
                        </div>

                        <button type="submit" class="btn-poncho-principal">Ingresar</button>
                        <p class="text-center mt-3 mb-0">
                            <a href="{% url 'registro_artesano' %}">¿No tenés cuenta? Registrate como artesano</a>
                        </p>
                    </fieldset>
                </form>

            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/comun.js' %}"></script>
    <script src="{% static 'js/login.js' %}"></script>
{% endblock %}
